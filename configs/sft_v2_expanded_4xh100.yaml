# OmniSRE v2.0 Assistant-Masked Exact-Schema Calibration SFT Config (4x H100)
# Evolves directly on top of OmniSRE v1.0 with expanded 22-fault K8s/SREGym + OpenRCA structured priors.
model:
  model_name_or_path: /mnt/nvme/omnisre-v1.0
  trust_remote_code: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  freeze_vision_tower: true
  freeze_mtp_heads: true

lora:
  enabled: true
  rank: 64
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
  exclude_modules:
    - ".*visual.*"
    - ".*vision_tower.*"
    - ".*merger.*"
    - ".*mtp.*"

data:
  train_jsonl: /mnt/nvme/data_v2_expanded/sft_v2_expanded_calibration.jsonl
  max_seq_length: 8192
  assistant_only_loss: true
  preserve_thinking: true

training:
  output_dir: /mnt/nvme/checkpoints_v2/sft-lora64
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8   # Global batch = 32 trajectories across 4x H100 (~95 steps, ~15 min)
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 12
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
  seed: 42
