# Least-Privilege RBAC for Stage 3 Live Kubernetes / SREGym RL Agents
# - Grants read-only inspection + targeted remediation inside `app-prod` namespace ONLY
# - Explicitly denies access to `sregym-injector`, `chaos-mesh`, `kube-system`, Secrets,
#   ClusterRoleBindings, and Namespace deletion (anti-reward-hacking & blast-radius isolation)
apiVersion: v1
kind: Namespace
metadata:
  name: app-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: sregym-injector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-rl-agent
  namespace: app-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-rl-agent-role
  namespace: app-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints", "configmaps", "resourcequotas"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "resourcequotas"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "resourcequotas"]
    verbs: ["delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-rl-agent-binding
  namespace: app-prod
subjects:
  - kind: ServiceAccount
    name: sre-rl-agent
    namespace: app-prod
roleRef:
  kind: Role
  name: sre-rl-agent-role
  apiGroup: rbac.authorization.k8s.io
